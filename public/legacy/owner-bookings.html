<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Брони гостей - Silva</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/account-pages.css">
</head>
<body class="profile-body-inter" data-owner-page="bookings">
    <div id="header-container"></div>

    <main class="account-page account-page--profile">
        <div class="account-page-inner account-page-inner--profile">
            <div class="account-main account-main--full">
                <h1 class="account-page-title">Брони гостей</h1>
                <p class="account-page-lead">
                    Актуальные бронирования гостей по вашим объектам в каталоге Silva.
                </p>

                <div class="owner-subnav-toolbar">
                    <nav class="owner-subnav" aria-label="Разделы владельца">
                        <a href="owner-properties.html" class="owner-subnav-link" data-key="properties">Мои объекты</a>
                        <a href="owner-bookings.html" class="owner-subnav-link" data-key="bookings">Брони гостей</a>

                    <a href="owner-property-edit.html" class="btn btn-primary owner-dashboard-add-btn owner-add-property-btn">Добавить объект</a>
                </div>

                <div id="owner-bookings-table-wrap" class="owner-guest-bookings-wrap" style="display: none;"></div>
                <div id="owner-bookings-empty" class="bookings-empty" style="display: none;">

                    <a href="owner-properties.html" class="btn btn-primary">Мои объекты</a>

    <script src="js/auth-modal.js"></script>

    <script src="js/components/footer.js"></script>
    <script src="js/owner-bookings.js"></script>
