<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Silva</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body auth-body--login">
    <div id="header-container"></div>
    <main class="auth-page">
        <div class="auth-wrapper anim-fade-up">
            <a href="index.html" class="auth-back" aria-label="Назад">
                <span class="silva-icon" data-icon="arrow-left" data-w="16" data-h="16" aria-hidden="true"></span>
                Назад
            </a>
            <div class="auth-form-column">
                <div class="auth-card">
                    <h1 class="auth-title">Вход</h1>
                    <p class="auth-subtitle">Войдите в аккаунт, чтобы бронировать жильё и управлять заказами.</p>
                    <form id="login-form">
                        <input type="email" class="input auth-login-input" name="email" placeholder="Почта" required autocomplete="email">
                        <div class="auth-password-field">
                            <input type="password" class="input auth-login-input" name="password" id="login-password" placeholder="Пароль" required autocomplete="current-password">
                            <button type="button" class="auth-password-toggle" id="login-password-toggle" aria-label="Показать пароль" aria-pressed="false">
                                <span class="silva-icon auth-pw-icon auth-pw-icon--off" data-icon="eye-off" data-w="18" data-h="18" aria-hidden="true"></span>
                                <span class="silva-icon auth-pw-icon auth-pw-icon--on auth-pw-icon--hidden" data-icon="eye" data-w="18" data-h="18" aria-hidden="true"></span>
                            </button>
                        </div>
                        <button type="submit" class="btn btn-primary auth-login-submit">Войти</button>
                    </form>
                    <a href="forgot-password.html" class="auth-forgot">Забыли пароль?</a>
                    <p class="auth-switch">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
                </div>
            </div>
            <div class="auth-visual">
                <div class="auth-visual-card">
                    <img src="images/vhod.jpg" alt="Загородное жильё Silva">
                </div>
            </div>
        </div>
    </main>
    <div id="footer-container"></div>
    <script src="js/icons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth-modal.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/animations.js"></script>
    <script>
        (function () {
            var pwd = document.getElementById('login-password');
            var toggle = document.getElementById('login-password-toggle');
            if (pwd && toggle) {
                toggle.addEventListener('click', function () {
                    var show = pwd.type === 'password';
                    pwd.type = show ? 'text' : 'password';
                    toggle.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
                    toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
                    var off = toggle.querySelector('.auth-pw-icon--off');
                    var on = toggle.querySelector('.auth-pw-icon--on');
                    if (off) off.classList.toggle('auth-pw-icon--hidden', show);
                    if (on) on.classList.toggle('auth-pw-icon--hidden', !show);
                });
            }
        })();
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            var submitBtn = this.querySelector('button[type="submit"]');
            var originalText = submitBtn ? submitBtn.textContent : '';
            try {
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Вход...';
                }
                await window.silvaSupabaseAuth.signIn(this.email.value.trim(), this.password.value);
                var u = {};
                try {
                    u = JSON.parse(localStorage.getItem('silva_user') || '{}');
                } catch (x) {}
                window.location.href = u.role === 'admin' ? 'admin.html' : 'index.html';
            } catch (err) {
                alert(err && err.message ? err.message : 'Не удалось войти. Проверьте данные и попробуйте снова.');
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText || 'Войти';
                }
            }
        });
    </script>
</body>
</html>
