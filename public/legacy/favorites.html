<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное - Silva</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/account-pages.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="account-page account-page--profile">
        <div class="account-page-inner account-page-inner--profile">
            <div class="account-main account-main--full">
                <h1 class="account-page-title">Избранное</h1>
                <p class="account-page-lead">
                    Объекты, которые вы сохранили. Цены и наличие дат уточняйте при бронировании.
                </p>

                <div id="favorites-grid-wrap" class="favorites-grid-wrap">
                    <div id="favorites-container" class="favorites-grid"></div>
                </div>

                <div id="favorites-empty" class="favorites-empty-state" style="display: none;">
                    <p>Пока пусто — добавляйте сердечком на карточке в каталоге или на странице объекта.</p>
                    <a href="catalog.html" class="btn btn-primary">Перейти в каталог</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="js/icons.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth-modal.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/property-card.js"></script>
    <script>
        (function () {
            function renderFavorites() {
                var container = document.getElementById('favorites-container');
                var emptyBlock = document.getElementById('favorites-empty');
                var wrap = document.getElementById('favorites-grid-wrap');
                if (!container || !emptyBlock) return;

                var ids = [];
                try {
                    var key = typeof getFavoritesStorageKey === 'function' ? getFavoritesStorageKey() : 'silva_favorites';
                    ids = JSON.parse(localStorage.getItem(key) || '[]');
                } catch (e) {}

                var properties = ids
                    .map(function (id) {
                        return typeof mockAPI !== 'undefined' && mockAPI.getPropertyById
                            ? mockAPI.getPropertyById(id)
                            : null;
                    })
                    .filter(Boolean);

                if (properties.length === 0) {
                    if (wrap) wrap.style.display = 'none';
                    emptyBlock.style.display = 'block';
                    container.innerHTML = '';
                } else {
                    if (wrap) wrap.style.display = 'block';
                    emptyBlock.style.display = 'none';
                    if (typeof renderPropertyCards === 'function') {
                        renderPropertyCards(container, properties);
                    }
                }
            }

            document.addEventListener('DOMContentLoaded', function () {
                if (typeof window.isLoggedIn === 'function' && !window.isLoggedIn()) {
                    window.location.href = 'login.html';
                    return;
                }
                renderFavorites();
                window.addEventListener('silva-favorites-changed', function () {
                    renderFavorites();
                    if (typeof initHeader === 'function') initHeader();
                });
            });
        })();
    </script>
</body>
</html>
