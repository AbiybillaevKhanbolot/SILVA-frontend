<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное - Silva</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/account-pages.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="account-page account-page--profile">
        <div class="account-page-inner account-page-inner--profile">
            <div class="account-main account-main--full">
                <h1 class="account-page-title">Избранное</h1>
                <p class="account-page-lead">
                    Объекты, которые вы сохранили. Цены и наличие дат уточняйте при бронировании.
                    Без входа список хранится только в этом браузере.
                </p>

                <div id="favorites-grid-wrap" class="favorites-grid-wrap">
                    <div id="favorites-container" class="favorites-grid"></div>
                </div>

                <div id="favorites-empty" class="favorites-empty-state" style="display: none;">
                    <p>Пока пусто — добавляйте сердечком на карточке в каталоге или на странице объекта.</p>
                    <a href="catalog.html" class="btn btn-primary">Перейти в каталог</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="js/icons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth-modal.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/property-card.js"></script>
    <script>
        (function () {
            async function renderFavorites() {
                var container = document.getElementById('favorites-container');
                var emptyBlock = document.getElementById('favorites-empty');
                var wrap = document.getElementById('favorites-grid-wrap');
                if (!container || !emptyBlock) return;

                if (
                    window.silvaSupabaseAuth &&
                    typeof window.silvaSupabaseAuth.fetchFavorites === 'function' &&
                    typeof window.isLoggedIn === 'function' &&
                    window.isLoggedIn()
                ) {
                    try { await window.silvaSupabaseAuth.fetchFavorites(); } catch (e) {}
                }
                if (typeof mockAPI !== 'undefined' && typeof mockAPI.refreshPropertiesFromSupabase === 'function') {
                    try { await mockAPI.refreshPropertiesFromSupabase(); } catch (e) {}
                }

                var ids = [];
                try {
                    var key = typeof getFavoritesStorageKey === 'function' ? getFavoritesStorageKey() : 'silva_favorites';
                    var parsed = JSON.parse(localStorage.getItem(key) || '[]');
                    ids = Array.isArray(parsed) ? parsed.map(function (x) { return String(x); }) : [];
                } catch (e) {
                    ids = [];
                }

                var byId = {};
                ids.forEach(function (fid) {
                    var p =
                        typeof mockAPI !== 'undefined' && mockAPI.getPropertyById
                            ? mockAPI.getPropertyById(fid)
                            : null;
                    if (p) byId[fid] = p;
                });
                var missing = ids.filter(function (fid) {
                    return !byId[fid];
                });
                if (
                    missing.length &&
                    window.silvaSupabaseAuth &&
                    typeof window.silvaSupabaseAuth.fetchPropertiesByIds === 'function'
                ) {
                    try {
                        var fetched = await window.silvaSupabaseAuth.fetchPropertiesByIds(missing);
                        (fetched || []).forEach(function (p) {
                            if (p && p.id != null) byId[String(p.id)] = p;
                        });
                        if (
                            typeof mockAPI !== 'undefined' &&
                            typeof mockAPI.appendPropertiesToCache === 'function' &&
                            fetched &&
                            fetched.length
                        ) {
                            mockAPI.appendPropertiesToCache(fetched);
                        }
                    } catch (e) {}
                }
                var properties = ids
                    .map(function (fid) {
                        return byId[fid] || null;
                    })
                    .filter(Boolean);

                if (properties.length === 0) {
                    if (wrap) wrap.style.display = 'none';
                    emptyBlock.style.display = 'block';
                    container.innerHTML = '';
                } else {
                    if (wrap) wrap.style.display = 'block';
                    emptyBlock.style.display = 'none';
                    if (typeof renderPropertyCards === 'function') {
                        renderPropertyCards(container, properties);
                    }
                }
            }

            document.addEventListener('DOMContentLoaded', function () {
                renderFavorites();
                window.addEventListener('silva-favorites-changed', function () {
                    renderFavorites();
                    if (typeof initHeader === 'function') initHeader();
                });
            });
        })();
    </script>
</body>
</html>
