<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Объект - Silva</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body,
        body * ,
        button,
        input,
        textarea,
        select {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
        }
        .property-page {
            padding-top: 5rem;
            padding-bottom: 2rem;
            background: var(--color-white);
            overflow-x: hidden;
        }
        .property-gallery {
            margin-top: 2rem;
            margin-bottom: 2rem;
            position: relative;
            width: 100%;
            height: 550px;
        }
        .property-gallery-layout {
            display: flex;
            gap: 1rem;
            height: 100%;
        }
        .property-gallery-main {
            height: 100%;
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;
            max-height: 100%;
            border-radius: 5px;
            overflow: hidden;
        }
        .property-gallery-side {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 1rem;
        }
        .property-gallery-card {
            border-radius: 5px;
            background: var(--color-gray-100);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }
        .property-gallery-card > img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        @media (max-width: 767px) {
            .property-gallery {
                height: auto;
            }
            .property-gallery-layout {
                flex-direction: column;
            }
            .property-gallery-main {
                width: 100%;
                height: auto;
                aspect-ratio: 16 / 9;
            }
            .property-gallery-side {
                width: 100%;
                grid-template-rows: none;
                min-height: 220px;
            }
        }
        .gallery-slider {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .gallery-main-slot {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 5px;
        }
        .gallery-main-slot > img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .gallery-slide-placeholder {
            width: 100%;
            height: 100%;
            background: var(--color-gray-100);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            box-sizing: border-box;
        }
        .gallery-slide-placeholder--thumb {
            gap: 0.35rem;
            padding: 0.25rem;
        }
        .gallery-slide-placeholder--thumb .gallery-placeholder-icon {
            width: 2rem;
            height: 2rem;
        }
        .gallery-placeholder-icon {
            width: 5rem;
            height: 5rem;
            color: var(--color-gray-400);
        }
        .gallery-placeholder-text {
            font-size: 0.875rem;
            color: var(--color-gray-400);
        }
        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 3rem;
            height: 3rem;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .gallery-nav:hover {
            background: var(--color-white);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .gallery-nav-prev {
            left: 1.5rem;
        }
        .gallery-nav-next {
            right: 1.5rem;
        }
        @media (max-width: 767px) {
            .gallery-nav-prev {
                left: 1rem;
            }
            .gallery-nav-next {
                right: 1rem;
            }
        }
        .gallery-nav svg {
            width: 1.5rem;
            height: 1.5rem;
            color: #000000;
        }
        .gallery-dots {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.5rem;
            z-index: 10;
        }
        .gallery-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.5);
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .gallery-dot.active {
            background: var(--color-white);
            width: 2rem;
        }
        .property-content {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }
        .property-summary {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 4rem;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        .property-summary-left {
            flex: 1;
            min-width: 0;
        }
        .property-summary-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1rem;
            flex-shrink: 0;
        }
        .property-summary-right .property-meta {
            flex-direction: column;
            align-items: flex-end;
            gap: 0.25rem;
        }
        .property-summary-right .property-meta > * {
            text-align: right;
        }
        .property-info {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .property-badges {
            display: none;
        }
        .property-title {
            font-size: 1.875rem;
            font-weight: 600;
            color: #000000;
            margin-bottom: 1.25rem;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-width: 100%;
        }
        @media (min-width: 768px) {
            .property-title {
                font-size: 2.25rem;
            }
        }
        .property-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
            color: var(--color-gray-600);
        }
        .property-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        @media (min-width: 768px) {
            .property-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .property-stat {
            background: var(--color-gray-50);
            border-radius: 5px;
            padding: 0;
            text-align: center;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
        }
        .property-stat-icon {
            width: 1.5rem;
            height: 1.5rem;
            color: var(--color-emerald-500);
            margin: 0 auto 0.5rem;
        }
        .property-stat-label {
            font-size: 0.875rem;
            color: var(--color-gray-500);
        }
        .property-stat-value {
            font-weight: 600;
            color: #000000;
        }
        .section-divider {
            height: 1px;
            background: var(--color-gray-200);
            margin: 2rem 0;
        }
        .property-section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #000000;
            margin-bottom: 1rem;
        }
        .property-description {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-weight: 500;
            font-size: 1rem;
            color: #9E9E9E;
            line-height: 1.6;
            white-space: pre-line;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-width: 100%;
        }
        .property-summary-description {
            min-width: 0;
            padding-right: 1rem;
            box-sizing: border-box;
        }
        @media (min-width: 768px) {
            .property-summary-description {
                padding-right: 2rem;
            }
        }
        .property-summary-description-title {
            font-size: 1rem;
            font-weight: 600;
            color: #000000;
            margin-bottom: 0.5rem;
        }
        .property-stats-text {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-weight: 500;
            font-size: 1rem;
            color: #9E9E9E;
            line-height: 1.6;
            margin-bottom: 0.75rem;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .property-summary-right .property-favorite-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: auto;
            height: auto;
            min-height: 40px;
            padding: 0.5rem 1.5rem;
            margin-top: 4rem;
            background: #ffffff;
            color: #000000;
            border: 1px solid var(--color-gray-200);
            border-radius: 5px;
            font-family: "Inter", system-ui, sans-serif;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
            transition: var(--silva-btn-fill-hover-transition, background-color 0.2s ease, color 0.2s ease,
                border-color 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease);
            filter: none;
            box-shadow: none;
        }
        .property-summary-right .property-favorite-btn:hover {
            background: #000000;
            color: #ffffff;
            border-color: var(--color-gray-400);
            box-shadow: var(--silva-btn-fill-hover-shadow, 0 6px 20px rgba(0, 0, 0, 0.3));
            filter: var(--silva-btn-fill-hover-filter, brightness(1.14));
            transform: none;
        }
        .property-summary-right .property-favorite-btn.in-favorites {
            background: #000000;
            color: #ffffff;
            border-color: var(--color-gray-400);
        }
        .property-summary-right .property-favorite-btn svg {
            display: none;
        }
        @media (max-width: 767px) {
            .property-summary {
                flex-direction: column;
                gap: 1.5rem;
                margin-top: 1.5rem;
            }
            .property-summary-left,
            .property-summary-right {
                max-width: 100%;
            }
            .property-summary-right {
                align-items: flex-start;
            }
        }
        .property-amenities-map {
            display: flex;
            align-items: stretch;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .property-amenities-col {
            flex: 0 0 38%;
            min-width: 0;
        }
        .property-map-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .property-map-col .property-map-wrap {
            flex: 1;
            min-height: 280px;
        }
        .amenities-grid.amenities-grid--list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .amenities-grid.amenities-grid--list .amenity-item {
            flex: 0 0 auto;
        }
        @media (max-width: 767px) {
            .property-amenities-map {
                flex-direction: column;
                gap: 1rem;
                margin-bottom: 1.5rem;
            }
            .property-map-col .property-map-wrap {
                min-height: 240px;
            }
        }
        .amenities-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        @media (min-width: 768px) {
            .amenities-grid:not(.amenities-grid--list) {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .amenity-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--color-gray-50);
            border-radius: 5px;
        }
        .amenity-icon {
            width: 1.25rem;
            height: 1.25rem;
            color: var(--color-emerald-500);
        }
        .booking-card {
            background: var(--color-white);
            border-radius: 5px;
            border: 1px solid var(--color-gray-200);
            padding: 1.25rem;
            box-shadow: none;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        @media (min-width: 768px) {
            .booking-card {
                padding: 2rem;
            }
        }
        .booking-card-content {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        @media (min-width: 1024px) {
            .booking-card-content {
                flex-direction: row;
                align-items: flex-start;
                gap: 3rem;
            }
        }
        .booking-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }
        .booking-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }
        @media (min-width: 1024px) {
            .booking-right {
                min-width: 350px;
                padding-top: 5rem;
            }
        }
        .booking-price {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }
        .booking-price-amount {
            font-size: 1.75rem;
            font-weight: 600;
            color: #000000;
        }
        @media (min-width: 768px) {
            .booking-price-amount {
                font-size: 2.25rem;
            }
        }
        .booking-price-unit {
            font-size: 1.125rem;
            color: var(--color-gray-500);
        }
        .booking-dates {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }
        .booking-date-input {
            padding: 1rem;
            border: 1px solid var(--color-gray-200);
            border-radius: 5px;
            background: var(--color-white);
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .booking-date-input:hover {
            background: #000000;
            border-color: #000000;
        }
        .booking-date-input > .booking-date-label,
        .booking-date-input > .booking-date-value {
            transition: color 0.2s ease;
        }
        .booking-date-input:hover > .booking-date-label,
        .booking-date-input:hover > .booking-date-value {
            color: #ffffff;
        }
        .booking-date-label {
            font-size: 0.875rem;
            color: var(--color-gray-500);
            margin-bottom: 0.25rem;
        }
        .booking-date-value {
            font-weight: 500;
            font-size: 1rem;
            color: #000000;
        }
        .booking-date-dropdown {
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 0;
            right: 0;
            background: var(--color-white);
            border: 1px solid var(--color-gray-200);
            border-radius: 5px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 1rem;
            z-index: 1000;
            display: none;
            min-width: 280px;
        }
        .booking-date-dropdown.active {
            display: block;
        }
        .booking-date-dropdown .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .booking-date-dropdown .calendar-nav-btn {
            width: 2rem;
            height: 2rem;
            border: none;
            background: var(--color-gray-100);
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--color-gray-700);
            transition: all 0.2s;
        }
        .booking-date-dropdown .calendar-nav-btn:hover {
            background: var(--color-gray-200);
            color: #000000;
        }
        .booking-date-dropdown .calendar-month-year {
            font-weight: 600;
            color: #000000;
            font-size: 0.9375rem;
        }
        .booking-date-dropdown .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.25rem;
            margin-bottom: 0.5rem;
        }
        .booking-date-dropdown .calendar-weekdays > div {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--color-gray-500);
            padding: 0.25rem;
        }
        .booking-date-dropdown .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.25rem;
        }
        .booking-date-dropdown .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--color-gray-700);
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .booking-date-dropdown .calendar-day:hover {
            background: var(--color-gray-100);
        }
        .booking-date-dropdown .calendar-day.other-month {
            color: var(--color-gray-400);
        }
        .booking-date-dropdown .calendar-day.today {
            background: var(--color-emerald-100);
            color: var(--color-emerald-700);
            font-weight: 600;
        }
        .booking-date-dropdown .calendar-day.selected {
            background: var(--color-emerald-500);
            color: var(--color-white);
            font-weight: 600;
        }
        .booking-date-dropdown .calendar-day.in-range {
            background: var(--color-emerald-100);
            color: var(--color-emerald-700);
            position: relative;
        }
        .booking-date-dropdown .calendar-day.in-range:hover {
            background: var(--color-emerald-200);
        }
        .booking-date-dropdown .calendar-day.range-start {
            background: var(--color-emerald-400);
            color: var(--color-white);
            font-weight: 600;
        }
        .booking-date-dropdown .calendar-day.range-end {
            background: var(--color-emerald-500);
            color: var(--color-white);
            font-weight: 600;
        }
        .booking-date-dropdown .calendar-day.range-start.selected {
            background: var(--color-emerald-500);
        }
        .booking-date-dropdown .calendar-day.disabled {
            color: var(--color-gray-300);
            cursor: not-allowed;
            pointer-events: none;
        }
        @media (max-width: 767px) {
            .booking-date-dropdown {
                position: fixed;
                left: 50% !important;
                right: auto !important;
                top: 50% !important;
                transform: translate(-50%, -50%);
                width: calc(100vw - 2rem);
                max-width: 320px;
                max-height: 90vh;
                overflow-y: auto;
            }
        }
        .booking-guests {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 1.125rem;
            border: 1px solid var(--color-gray-200);
            border-radius: 5px;
        }
        .booking-guests-item {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .booking-guests-item:not(:last-child) {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--color-gray-200);
        }
        .booking-guests-info {
            display: flex;
            flex-direction: column;
        }
        .booking-guests-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        .booking-guests-btn {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 5px;
            border: 1px solid var(--color-gray-200);
            background: var(--color-white);
            color: #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            font-weight: 400;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        .booking-guests-btn:hover {
            background: #000000;
            border-color: #000000;
            color: #ffffff;
        }
        .booking-guests-btn:active {
            transform: scale(0.98);
        }
        .price-breakdown {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            color: var(--color-gray-600);
            font-size: 1rem;
        }
        .price-row-total {
            font-weight: 600;
            font-size: 1.25rem;
            color: #000000;
            padding-top: 0.75rem;
            border-top: 1px solid var(--color-gray-200);
        }
        .reviews-section {
            margin-top: 2rem;
        }
        .review-item {
            background: var(--color-gray-50);
            border-radius: 5px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .review-header {
            display: flex;
            align-items: start;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        .review-avatar {
            width: 3rem;
            height: 3rem;
            border-radius: 5px;
            background: var(--color-emerald-100);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-emerald-700);
            font-weight: 600;
        }
        .review-info {
            flex: 1;
        }
        .review-name {
            font-weight: 500;
            color: #000000;
        }
        .review-rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .review-text {
            color: var(--color-gray-600);
        }
        .property-header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .property-favorite-btn {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 5px;
            border: 1px solid var(--color-gray-200);
            background: var(--color-white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .property-favorite-btn:hover {
            border-color: var(--color-gray-400);
            background: #000000;
            color: #ffffff;
        }
        .property-favorite-btn.in-favorites {
            background: #000000;
            border-color: var(--color-gray-400);
            color: #ffffff;
        }
        .property-favorite-btn svg { width: 1.25rem; height: 1.25rem; }
        .property-description-wrap {
            position: relative;
            min-width: 0;
            max-width: 100%;
        }
        .property-description-wrap.collapsed .property-description-full { max-height: 6rem; overflow: hidden; }
        .property-description-toggle {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-gray-700);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .property-description-toggle:hover { color: #000000; text-decoration: underline; }
        .property-section-block {
            margin-bottom: 1.5rem;
        }
        .property-section-block:last-child { margin-bottom: 0; }
        .property-section-block h2 { margin-bottom: 0.75rem; }
        .property-info-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .property-info-card {
            background: var(--color-white);
            border: 1px solid var(--color-gray-200);
            border-radius: 5px;
            padding: 1.5rem 1.5rem;
            box-shadow: none;
            min-height: 200px;
            display: flex;
            flex-direction: column;
        }
        .property-info-card .property-section-title {
            margin-bottom: 0.75rem;
            font-weight: 400;
        }
        .property-info-card .property-description {
            margin: 0;
            flex: 1;
        }
        @media (max-width: 767px) {
            .property-info-cards {
                grid-template-columns: 1fr;
            }
        }
        .property-map-wrap {
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--color-gray-200);
            height: 280px;
            background: var(--color-gray-100);
        }
        .property-map-wrap iframe { width: 100%; height: 100%; border: 0; }
        .property-conditions-list, .property-extra-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .property-conditions-list li, .property-extra-list li {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--color-gray-100);
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 500;
            font-size: 1rem;
            color: #9E9E9E;
            line-height: 1.6;
        }
        .property-conditions-list li:last-child, .property-extra-list li:last-child { border-bottom: none; }
        .reviews-overview {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }
        .reviews-overview-score {
            background: var(--color-emerald-500);
            color: var(--color-white);
            padding: 1rem 1.25rem;
            border-radius: 5px;
            min-width: 7rem;
            text-align: center;
        }
        .reviews-overview-score-num { font-size: 1.75rem; font-weight: 700; display: block; }
        .reviews-overview-score-label { font-size: 0.875rem; opacity: 0.95; }
        .reviews-overview-text { font-size: 0.875rem; color: var(--color-gray-600); max-width: 20rem; line-height: 1.5; }
        .reviews-categories {
            flex: 1;
            min-width: 200px;
        }
        .reviews-category-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        .reviews-category-label { font-size: 0.875rem; color: var(--color-gray-700); min-width: 8rem; }
        .reviews-category-bar {
            flex: 1;
            height: 8px;
            background: var(--color-gray-200);
            border-radius: 5px;
            overflow: hidden;
        }
        .reviews-category-fill { height: 100%; background: var(--color-emerald-500); border-radius: 5px; }
        .reviews-category-value { font-size: 0.875rem; font-weight: 600; color: #000000; min-width: 2.5rem; }
        .reviews-guest-photos { margin-bottom: 1.5rem; }
        .reviews-guest-photos h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; color: #000000; }
        .reviews-photos-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .reviews-photo-thumb {
            width: 5rem; height: 5rem; border-radius: 5px; object-fit: cover; border: 1px solid var(--color-gray-200);
        }
        .reviews-sort-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem; }
        .reviews-sort-row select { padding: 0.5rem 2rem 0.5rem 0.75rem; border-radius: 5px; border: 1px solid var(--color-gray-200); font-size: 0.875rem; }
        .review-card {
            background: var(--color-white);
            border: 1px solid var(--color-gray-100);
            border-radius: 5px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .review-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 0.75rem; }
        .review-card-author { font-weight: 600; color: #000000; font-size: 0.9375rem; }
        .review-card-meta { font-size: 0.8125rem; color: var(--color-gray-500); margin-top: 0.25rem; }
        .review-card-score { background: var(--color-emerald-100); color: var(--color-emerald-700); padding: 0.35rem 0.6rem; border-radius: 5px; font-size: 0.8125rem; font-weight: 600; }
        .review-card-text { font-size: 0.9375rem; color: var(--color-gray-600); line-height: 1.55; }
        .review-card-expand { font-size: 0.875rem; color: var(--color-emerald-600); cursor: pointer; margin-top: 0.5rem; background: none; border: none; padding: 0; }
        .review-card-helpful { font-size: 0.8125rem; color: var(--color-gray-500); margin-top: 1rem; }
        .review-card-helpful span { margin-right: 0.75rem; cursor: pointer; }
        .btn-leave-review {
            padding: 0.625rem 1.25rem;
            border-radius: 5px;
            border: 1px solid var(--color-gray-200);
            background: var(--color-white);
            color: #000000;
            font-weight: 500;
            font-size: 0.9375rem;
            cursor: pointer;
            box-sizing: border-box;
        }
        .btn-leave-review:hover {
            background: #000000;
            color: #ffffff;
            border-color: var(--color-gray-400);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.open { display: flex; }
        .modal-review {
            position: relative;
            background: var(--color-white);
            border-radius: 5px;
            max-width: 28rem;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            padding-top: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .modal-review h3 { margin-bottom: 1rem; font-size: 1.25rem; }
        .modal-review .form-group { margin-bottom: 1rem; }
        .modal-review .form-label { display: block; margin-bottom: 0.35rem; font-size: 0.875rem; font-weight: 500; color: var(--color-gray-700); }
        .modal-review .form-input, .modal-review textarea { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--color-gray-200); border-radius: 5px; font-size: 0.9375rem; }
        .modal-review textarea { min-height: 5rem; resize: vertical; }
        .modal-review-stars { display: flex; gap: 0.25rem; margin-bottom: 0.5rem; }
        .modal-review-stars button { background: none; border: none; padding: 0; cursor: pointer; color: var(--color-gray-300); }
        .modal-review-stars button.active, .modal-review-stars button:hover { color: var(--color-amber-400); }
        .modal-review-photos { margin-top: 0.5rem; }
        .modal-review-photos input[type="file"] { font-size: 0.875rem; }
        .modal-review-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
        .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; cursor: pointer; padding: 0.25rem; color: var(--color-gray-500); }
    </style>
</head>
<body>
    <div id="header-container"></div>
    
    <div class="property-page">
        <div class="container">
            <!-- Gallery -->
            <div class="property-gallery">
                <div class="property-gallery-layout">
                    <div class="property-gallery-main">
                        <div class="gallery-slider" id="gallery-slider">
                            <div class="gallery-main-slot" id="gallery-main-slot"></div>
                            <button class="gallery-nav gallery-nav-prev" id="gallery-prev" type="button" aria-label="Предыдущее фото">
                                <span class="silva-icon" data-icon="chevron-left" data-w="24" data-h="24" aria-hidden="true"></span>
                            </button>
                            <button class="gallery-nav gallery-nav-next" id="gallery-next" type="button" aria-label="Следующее фото">
                                <span class="silva-icon" data-icon="chevron-right" data-w="24" data-h="24" aria-hidden="true"></span>
                            </button>
                            <div class="gallery-dots" id="gallery-dots"></div>
                        </div>
                    </div>
                    <div class="property-gallery-side" id="property-gallery-thumbs">
                        <div class="property-gallery-card gallery-thumb-slot" data-thumb="1"></div>
                        <div class="property-gallery-card gallery-thumb-slot" data-thumb="1"></div>
                        <div class="property-gallery-card gallery-thumb-slot" data-thumb="1"></div>
                        <div class="property-gallery-card gallery-thumb-slot" data-thumb="1"></div>
                    </div>
                </div>
            </div>
            
            <!-- Content -->
            <div class="property-content">
                <div class="property-info">
                    <div class="property-summary">
                        <div class="property-summary-left">
                            <h1 class="property-title" id="property-title"></h1>
                            <div class="property-summary-description">
                                <div class="property-summary-description-title">Описание</div>
                                <p class="property-stats-text" id="property-stats-text"></p>
                                <div class="property-description-wrap" id="property-description-wrap">
                                    <div class="property-description property-description-full" id="property-description"></div>
                                    <button type="button" class="property-description-toggle" id="property-description-toggle">Развернуть описание</button>
                                </div>
                            </div>
                        </div>
                        <div class="property-summary-right">
                            <div class="property-meta" id="property-meta"></div>
                            <button type="button" class="property-favorite-btn" id="property-favorite-btn" aria-label="В избранное">
                                <span class="silva-icon" data-icon="heart" data-w="18" data-h="18" data-fill="none" aria-hidden="true"></span>
                                В избранное
                            </button>
                        </div>
                    </div>
                    
                    <div class="section-divider"></div>
                    
                    <div class="property-amenities-map">
                        <div class="property-amenities-col">
                            <h2 class="property-section-title">Удобства</h2>
                            <div class="amenities-grid amenities-grid--list" id="amenities-grid"></div>
                        </div>
                        <div class="property-map-col">
                            <h2 class="property-section-title">Карта</h2>
                            <div class="property-map-wrap" id="property-map-wrap">
                                <iframe id="property-map" src="" title="Карта" loading="lazy"></iframe>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section-divider"></div>
                    
                    <div class="property-info-cards">
                        <div class="property-info-card">
                            <h2 class="property-section-title">Условия размещения</h2>
                            <ul class="property-conditions-list" id="property-conditions"></ul>
                        </div>
                        <div class="property-info-card">
                            <h2 class="property-section-title">Дополнительная информация</h2>
                            <ul class="property-extra-list" id="property-extra-info"></ul>
                        </div>
                        <div class="property-info-card">
                            <h2 class="property-section-title">Визовая информация</h2>
                            <p class="property-description" id="property-visa-info"></p>
                        </div>
                    </div>
                    
                    <div class="section-divider"></div>
                    
                    <!-- Booking Card -->
                    <div class="booking-card" id="booking-card">
                        <!-- Booking card will be loaded here -->
                    </div>
                    
                    <div class="section-divider"></div>
                    
                    <div class="reviews-section">
                        <div class="reviews-overview" id="reviews-overview">
                            <div class="reviews-overview-score">
                                <span class="reviews-overview-score-num" id="reviews-overview-num">0</span>
                                <span class="reviews-overview-score-label" id="reviews-overview-label">—</span>
                            </div>
                            <p class="reviews-overview-text" id="reviews-overview-text">Основано на отзывах гостей.</p>
                            <div class="reviews-categories" id="reviews-categories"></div>
                        </div>
                        <div class="reviews-guest-photos" id="reviews-guest-photos" style="display: none;">
                            <h3>Фото гостей · <span id="reviews-photos-count">0</span></h3>
                            <div class="reviews-photos-row" id="reviews-photos-row"></div>
                        </div>
                        <div class="reviews-sort-row">
                            <h2 class="property-section-title" style="margin-bottom: 0;">Отзывы (<span id="reviews-count">0</span>)</h2>
                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <select id="reviews-sort" class="reviews-sort-select">
                                    <option value="useful">Сначала полезные</option>
                                    <option value="new">Сначала новые</option>
                                    <option value="rating-high">По рейтингу (высокий)</option>
                                </select>
                                <button type="button" class="btn-leave-review" id="btn-leave-review">Оставить отзыв</button>
                            </div>
                        </div>
                        <div id="reviews-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="review-modal">
        <div class="modal-review">
            <button type="button" class="modal-close" id="review-modal-close" aria-label="Закрыть">&times;</button>
            <h3>Оставить отзыв</h3>
            <form id="review-form">
                <div class="form-group">
                    <label class="form-label">Ваша оценка</label>
                    <div class="modal-review-stars" id="review-stars">
                        <button type="button" data-rating="1" aria-label="1 звезда">★</button>
                        <button type="button" data-rating="2" aria-label="2 звезды">★</button>
                        <button type="button" data-rating="3" aria-label="3 звезды">★</button>
                        <button type="button" data-rating="4" aria-label="4 звезды">★</button>
                        <button type="button" data-rating="5" aria-label="5 звёзд">★</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="review-text">Текст отзыва</label>
                    <textarea id="review-text" placeholder="Расскажите о вашем отдыхе..." rows="4"></textarea>
                </div>
                <div class="form-group modal-review-photos">
                    <label class="form-label">Фотографии (необязательно)</label>
                    <input type="file" id="review-photos" accept="image/*" multiple>
                    <div id="review-photos-preview" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem;"></div>
                </div>
                <div class="modal-review-actions">
                    <button type="submit" class="btn btn-primary">Отправить отзыв</button>
                    <button type="button" class="btn btn-ghost" id="review-modal-cancel">Отмена</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="footer-container"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/property-gallery-widget.js"></script>
    <script src="js/auth-modal.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/property-card.js"></script>
    <script src="js/property.js"></script>
</body>
</html>
